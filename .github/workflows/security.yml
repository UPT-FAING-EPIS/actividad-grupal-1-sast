name: Escaneo de seguridad

# Automatizaciones de seguridad que complementan a los laboratorios de la unidad,
# usando herramientas distintas:
#
#   - OWASP Dependency-Check: vulnerabilidades conocidas (CVE) en las
#     dependencias transitivas, contra la base de datos de la OWASP.
#   - gosec: analisis estatico del codigo Go con reglas mapeadas a CWE.
#
# La diferencia con los laboratorios: ahi se reviso el codigo con SonarCloud,
# Semgrep y Snyk; aqui se cubren las dependencias y un lenguaje distinto (Go).
#
# tfsec se retiro de este workflow a proposito: no hay codigo Terraform en este
# repositorio (la unidad lo cubierta en un laboratorio aparte) y `tfsec-action@v1`
# ya no resuelve como etiqueta publicada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # La base de avisos cambia a diario: revisar una vez por semana detecta
    # vulnerabilidades publicadas despues del ultimo push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # working-directory: app es obligatorio. go.mod vive en app/, no en la raiz,
      # asi que el patron ./app/... ejecutado desde la raiz no tiene modulo que
      # resolver: gosec responde con "Files: 0" sin explicar por que.
      - name: Escanear el codigo Go
        working-directory: app
        run: |
          set -o pipefail
          $(go env GOPATH)/bin/gosec -no-fail -fmt=json -out="$GITHUB_WORKSPACE/informe.json" ./...
          test -f "$GITHUB_WORKSPACE/informe.json"

      # Un escaneo que no encuentra nada y un escaneo que no ocurrio se ven
      # igual en el log. Este paso separa los dos casos y ademas deja el
      # resumen legible que se descarga como artefacto.
      - name: Resumen legible
        if: always()
        run: |
          test -f informe.json || { echo "::error::gosec no produjo informe"; exit 1; }
          python3 - <<'EOF'
          import json, collections, pathlib
          d = json.load(open('informe.json'))
          iss = d.get('Issues') or []
          st  = d.get('Stats') or {}
          sev = collections.Counter(i['severity'] for i in iss)
          lineas = [
              f"Archivos: {st.get('files')} | Lineas: {st.get('lines')} | Hallazgos: {st.get('issues')}",
              f"Por severidad: {dict(sev)}",
              "",
          ]
          for i in iss:
              lineas.append(f"[{i['severity']}] {i['rule_id']} {i['file']}:{i['line']} {i['details']}")
          pathlib.Path('gosec-resumen.txt').write_text('\n'.join(lineas), encoding='utf-8')
          print('\n'.join(lineas[:2]))
          if not iss:
              raise SystemExit("::error::0 hallazgos: el escaneo no ocurrio, no salio limpio")
          EOF

      - name: Publicar el resumen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec
          path: |
            informe.json
            gosec-resumen.txt
          retention-days: 30

  dependencias:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache de la base de datos
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: dependency-check-${{ hashFiles('app/go.mod') }}
          restore-keys: dependency-check-

      # El script cli/release.sh ya no existe en el repositorio upstream: pedia
      # un 404 y su cuerpo ("404: Not Found")acababa ejecutado por bash. Se
      # instala descargando el ZIP de la ultima release publicada.
      - name: Instalar OWASP Dependency-Check
        run: |
          set -euo pipefail
          VER=$(curl -sSL --max-time 60 https://api.github.com/repos/dependency-check/DependencyCheck/releases/latest \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "Dependency-Check $VER"
          curl -sSL --max-time 300 -o /tmp/dc.zip \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v${VER}/dependency-check-${VER}-release.zip"
          unzip -q /tmp/dc.zip -d /opt
          # $GITHUB_PATH solo se aplica a los pasos SIGUIENTES, asi que en este
                    # mismo paso hay que invocar el binario por su ruta completa.
          echo "/opt/dependency-check/bin" >> "$GITHUB_PATH"
          /opt/dependency-check/bin/dependency-check --version

      # El modulo de app/ no declara dependencias de terceros, asi que el
      # escaneo sale en cero. Eso es un dato, no un fallo: el resumen declara
      # cuantas dependencias se leyeron para que el cero sea interpretable.
      - name: Escanear el modulo Go
        run: |
          set -o pipefail
          dependency-check \
            --project "SAST TaskFlow" \
            --scan app \
            --out ./informes/dependencias \
            --format HTML \
            --format SARIF \
            --data ~/.gradle/caches \
            --noupdate || true

      - name: Resumen legible
        if: always()
        run: |
          mkdir -p informes/dependencias
          test -f informes/dependencias/dependency-check-report.json || \
            { echo "::error::Dependency-Check no produjo informe"; exit 1; }
          python3 - <<'EOF'
          import json, pathlib
          d = json.load(open('informes/dependencias/dependency-check-report.json'))
          deps = d.get('dependencies') or []
          vulns = [v for dep in deps for v in (dep.get('vulnerabilities') or [])]
          texto = (
              f"Dependencias analizadas: {len(deps)}\n"
              f"Vulnerabilidades con CVE: {len(vulns)}\n"
          )
          pathlib.Path('informes/dependencias/resumen.txt').write_text(texto, encoding='utf-8')
          print(texto)
          if not deps:
              print("::warning::0 dependencias de terceros: el cero no es garantia de seguridad")
          EOF

      - name: Publicar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: ./informes/dependencias
          retention-days: 30
