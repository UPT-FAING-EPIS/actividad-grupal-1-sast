name: Escaneo de seguridad

# Automatizaciones de seguridad que complementan a los laboratorios de la unidad,
# usando herramientas distintas:
#
#   - OWASP Dependency-Check: vulnerabilidades conocidas (CVE) en las
#     dependencias transitivas, contra la base de datos de la OWASP.
#   - gosec: analisis estatico del codigo Go con reglas mapeadas a CWE.
#
# La diferencia con los laboratorios: ahi se reviso el codigo con SonarCloud,
# Semgrep y Snyk; aqui se cubren las dependencias y un lenguaje distinto (Go).
#
# tfsec se retiro de este workflow a proposito: no hay codigo Terraform en este
# repositorio (la unidad lo cubierta en un laboratorio aparte) y `tfsec-action@v1`
# ya no resuelve como etiqueta publicada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # La base de avisos cambia a diario: revisar una vez por semana detecta
    # vulnerabilidades publicadas despues del ultimo push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # gosec sin el compilador de Go termina sin error y reporta "Files: 0",
      # que parece un escaneo limpio cuando en realidad no analizo nada.
      # Por eso el paso siguiente verifica que el informe tenga hallazgos.
      - name: Escanear el codigo Go
        run: |
          set -o pipefail
          $(go env GOPATH)/bin/gosec -no-fail -fmt=json -out=gosec.json ./app/...
          test -f gosec.json

      - name: Resumen legible
        if: always()
        run: |
          test -f gosec.json || { echo "::error::gosec no produjo informe"; exit 1; }
          python3 - <<'EOF'
          import json, collections, pathlib
          d = json.load(open('gosec.json'))
          iss = d.get('Issues') or []
          st  = d.get('Stats') or {}
          sev = collections.Counter(i['severity'] for i in iss)
          lineas = [
              f"Archivos: {st.get('files')} | Lineas: {st.get('lines')} | Hallazgos: {st.get('issues')}",
              f"Por severidad: {dict(sev)}",
              "",
          ]
          for i in iss:
              lineas.append(f"[{i['severity']}] {i['rule_id']} {i['file']}:{i['line']} {i['details']}")
          pathlib.Path('gosec-resumen.txt').write_text('\n'.join(lineas), encoding='utf-8')
          print('\n'.join(lineas[:3]))
          if not iss:
              raise SystemExit("::error::0 hallazgos: el escaneo no ocurrio, no salio limpio")
          EOF

      - name: Publicar el resumen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec
          path: |
            gosec.json
            gosec-resumen.txt
          retention-days: 30

  dependencias:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache de la base de datos
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: dependency-check-${{ hashFiles('app/go.mod') }}
          restore-keys: dependency-check-

      - name: Instalar OWASP Dependency-Check
        run: |
          curl -sSL https://raw.githubusercontent.com/dependency-check/DependencyCheck/master/cli/release.sh \
            | bash -s -- --only-modified
          mv dependency-check.sh /usr/local/bin/dependency-check
          chmod +x /usr/local/bin/dependency-check

      # El modulo de app/ no declara dependencias de terceros, asi que el
      # escaneo sale en cero. Eso es un dato, no un fallo: se reporta el
      # numero de dependencias leidas para que el cero sea interpretable.
      - name: Escanear el modulo Go
        run: |
          set -o pipefail
          dependency-check \
            --project "SAST TaskFlow" \
            --scan app \
            --enableGoModules \
            --out ./informes/dependencias \
            --format HTML \
            --format SARIF \
            --data ~/.gradle/caches

      - name: Resumen legible
        if: always()
        run: |
          mkdir -p informes/dependencias
          test -f informes/dependencias/dependency-check-report.json || \
            { echo "::error::Dependency-Check no produjo informe"; exit 1; }
          python3 - <<'EOF'
          import json, pathlib
          d = json.load(open('informes/dependencias/dependency-check-report.json'))
          deps = d.get('dependencies') or []
          vulns = [v for dep in deps for v in (dep.get('vulnerabilities') or [])]
          texto = (
              f"Dependencias analizadas: {len(deps)}\n"
              f"Vulnerabilidades con CVE: {len(vulns)}\n"
          )
          pathlib.Path('informes/dependencias/resumen.txt').write_text(texto, encoding='utf-8')
          print(texto)
          if not deps:
              print("::warning::0 dependencias de terceros: el cero no es una garantia de seguridad")
          EOF

      - name: Publicar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: ./informes/dependencias
          retention-days: 30