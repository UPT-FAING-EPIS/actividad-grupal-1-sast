name: Publicar informe SAST

# Despliega el informe de SAST a Vercel en cada push a main.
# El sitio es estatico puro (web/index.html): no hay paso de build, solo publicacion.

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
  schedule:
    # Reescanea la app cada lunes y republisha el informe con los hallazgos
    # que hubiera en ese momento.
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  gosec:
    name: Escanear app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # go.mod vive en app/, no en la raiz: hay que escanear desde ahi.
      - name: Escanear
        working-directory: app
        run: |
          set -o pipefail
          $(go env GOPATH)/bin/gosec -no-fail -fmt=json -out="$GITHUB_WORKSPACE/informe.json" ./...
          test -f "$GITHUB_WORKSPACE/informe.json"

      - name: Resumen
        if: always()
        run: |
          test -f informe.json || { echo "::error::gosec no produjo informe"; exit 1; }
          python3 - <<'EOF'
          import json, collections, pathlib
          d = json.load(open('informe.json'))
          iss = d.get('Issues') or []
          st  = d.get('Stats') or {}
          sev = collections.Counter(i['severity'] for i in iss)
          print(f"Hallazgos: {len(iss)} | {dict(sev)}")
          print(f"Archivos: {st.get('files')} | Lineas: {st.get('lines')}")
          pathlib.Path('gosec-resumen.txt').write_text('\n'.join(f"[{i['severity']}] {i['rule_id']} {i['file']}:{i['line']} {i['details']}" for i in iss), encoding='utf-8')
          if not iss:
              raise SystemExit("::error::0 hallazgos: el escaneo no ocurrio")
          EOF

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-gosec
          path: |
            informe.json
            gosec-resumen.txt

  publicar:
    name: Desplegar en Vercel
    needs: gosec
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Sin esta verificacion, un secret ausente se convierte en `--token ""` y
      # el unico error que sale es "You defined --token, but it's missing a
      # value", que no dice nada sobre que falta configurarlo.
      - name: Verificar secrets de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secret $v en este repositorio (Settings > Secrets > Actions)"
              exit 1
            fi
          done
          echo "Los tres secrets de Vercel estan presentes."

      # El CLI de Vercel no recibe el proyecto por variables de entorno: las lee
      # de web/.vercel/project.json. Con solo --token y --scope el comando
      # responde "You specified VERCEL_PROJECT_ID but you forgot VERCEL_ORG_ID"
      # o despliega en un proyecto equivocado.
      - name: Desplegar
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"projectId": "%s", "orgId": "%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          cat .vercel/project.json
          npx --yes vercel@25 deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "--- alias de produccion ---"
          npx --yes vercel@25 ls --yes --token "$VERCEL_TOKEN" 2>/dev/null | head -20 || true